[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trarium"
version = "1.4.0"
description = "ترجمه خودکار کتاب با هوش مصنوعی"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "requests>=2.31.0",
    "PyMuPDF>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "ebooklib>=0.18",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    "Pillow>=10.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "tiktoken>=0.8.0",
    "numpy>=1.24.0",
    "yt-dlp>=2025.1.1",
    "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
ocr-paddle = ["paddleocr>=3.0.0,<4", "paddlepaddle>=3.0.0,<4"]
ocr-easy = ["easyocr>=1.7.2"]
ocr-surya = ["surya-ocr>=0.22.1"]
ocr-tesseract = ["pytesseract>=0.3.13"]
image-opencv = ["opencv-python-headless>=4.8.0"]
ocr-all = ["paddleocr>=3.0.0,<4", "paddlepaddle>=3.0.0,<4", "easyocr>=1.7.2", "surya-ocr>=0.22.1", "pytesseract>=0.3.13"]

[project.scripts]
trarium = "trarium.cli:main"

[tool.setuptools.packages.find]
include = ["trarium*"]

[tool.setuptools.package-data]
trarium = ["fonts/*.ttf"]
