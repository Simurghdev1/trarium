name: Trarium FA classic run (OCR.space + Gemini lite)
on:
  push:
    branches: ["ci/fa-run-classic"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt requests
      - name: Translate both PDFs to Persian
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OCR_SPACE_KEY: ${{ secrets.OCR_SPACE_KEY }}
          TRARIUM_OCR_SPACE_KEY: ${{ secrets.OCR_SPACE_KEY }}
          TRARIUM_HOME: ${{ runner.temp }}/trarium-home
        run: |
          mkdir -p out
          set +e
          python qa/run_undine_test.py --input ci_run/inputs/undine_scan_3p.pdf --outdir out/scan_3p --ocr-pages 1,2,3 --providers gemini,openrouter --qc-repair 2>&1 | tee out/scan_3p.log
          a=$?
          python qa/run_undine_test.py --input ci_run/inputs/undine_text_6p.pdf --outdir out/text_6p --ocr-pages 1,2,3,4,5,6 --providers gemini,openrouter --qc-repair 2>&1 | tee out/text_6p.log
          b=$?
          echo "exit codes: $a $b"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trarium-fa-classic
          path: out/**
