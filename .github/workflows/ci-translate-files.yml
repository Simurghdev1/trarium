name: Trarium translate files

# Translates real files on GitHub's runners, so the API credits of the
# repository owner are spent and not the tokens of whoever drives the agent.
#
# The input files live in the private `trarium-files` repository; the code
# comes from this repository. The outputs are uploaded as an artifact and can
# be pushed back into `trarium-files` (input: publish).
on:
  workflow_dispatch:
    inputs:
      files:
        description: "Comma-separated paths inside trarium-files, e.g. 'books/x.epub,qa/outputs/y.pdf'"
        required: true
        type: string
      target_lang:
        description: "Target language"
        required: false
        default: "fa"
        type: string
      style:
        description: "Translation style (neutral, literary, plain, manga, lightnovel)"
        required: false
        default: "neutral"
        type: string
      providers:
        description: "Comma-separated providers: gemini,openrouter"
        required: false
        default: "gemini,openrouter"
        type: string
      ocr:
        description: "OCR the scanned PDF pages"
        required: false
        default: "true"
        type: boolean
      ocr_method:
        description: "auto | ocrspace | pdf24 | openrouter"
        required: false
        default: "ocrspace"
        type: string
      ocr_pages:
        description: "Pages whose text layer is noise and must be read by OCR, e.g. 12,17,21"
        required: false
        default: ""
        type: string
      pages:
        description: "Pages to skip, e.g. 1,5,10-12"
        required: false
        default: ""
        type: string
      out_format:
        description: "Output format for books (txt|pdf|epub|html); empty = same as the source"
        required: false
        default: ""
        type: string
      workers:
        description: "Parallel translation workers"
        required: false
        default: "4"
        type: string
      batch_chars:
        description: "Characters per translation batch"
        required: false
        default: "7000"
        type: string
      outdir:
        description: "Folder for the outputs inside trarium-files"
        required: false
        default: "qa/outputs/github-run"
        type: string
      publish:
        description: "Push the outputs back into trarium-files"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: translate-files
  cancel-in-progress: false

jobs:
  translate:
    name: Translate ${{ inputs.files }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OCR_SPACE_KEY: ${{ secrets.OCR_SPACE_KEY }}
      TRARIUM_OCR_SPACE_KEY: ${{ secrets.OCR_SPACE_KEY }}
      TRARIUM_HOME: ${{ runner.temp }}/trarium-home
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check out the input files (private repo)
        env:
          FILES_PAT: ${{ secrets.FILES_PAT }}
          FILES_SPEC: ${{ inputs.files }}
        run: |
          set -euo pipefail
          if [ -z "$FILES_PAT" ]; then
            echo "::error::the FILES_PAT secret is not configured on this repository"
            exit 1
          fi
          mkdir -p files
          cd files
          git init -q
          git remote add origin "https://x-access-token:${FILES_PAT}@github.com/Simurghdev1/trarium-files.git"
          # Only the requested files are downloaded: the whole repository is ~500 MB.
          git sparse-checkout init --no-cone
          printf '%s\n' "${FILES_SPEC//,/$'\n'}" | sed '/^[[:space:]]*$/d' | git sparse-checkout set --stdin
          git fetch --depth 1 --filter=blob:none origin main
          git checkout -B main FETCH_HEAD
          echo "--- fetched ---"
          find . -path ./.git -prune -o -type f -print | head -40

      - name: Prepare the input list
        id: prepare
        run: |
          python - <<'PY'
          import pathlib
          spec = "${{ inputs.files }}"
          found, missing = [], []
          for part in spec.split(","):
              part = part.strip()
              if not part:
                  continue
              p = pathlib.Path("files") / part
              (found if p.exists() else missing).append(str(p))
              if not p.exists():
                  print(f"::warning::input not found: {p}")
          pathlib.Path("inputs.txt").write_text("\n".join(found), encoding="utf-8")
          print("inputs:", found or "(none)")
          PY
          test -s inputs.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt requests tiktoken

      - name: Translate
        run: |
          set -o pipefail
          mkdir -p "${{ inputs.outdir }}"
          OCR_FLAG=""
          if [ "${{ inputs.ocr }}" = "true" ]; then
            OCR_FLAG="--ocr"
          fi
          python qa/translate_files.py \
            --list inputs.txt \
            --outdir "${{ inputs.outdir }}" \
            --target-lang "${{ inputs.target_lang }}" \
            --style "${{ inputs.style }}" \
            --providers "${{ inputs.providers }}" \
            $OCR_FLAG \
            --ocr-method "${{ inputs.ocr_method }}" \
            --ocr-pages "${{ inputs.ocr_pages }}" \
            --pages "${{ inputs.pages }}" \
            --out-format "${{ inputs.out_format }}" \
            --workers "${{ inputs.workers }}" \
            --batch-chars "${{ inputs.batch_chars }}" \
            2>&1 | tee translate.log

      - name: Upload the translated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trarium-translate-${{ github.run_number }}
          path: |
            ${{ inputs.outdir }}/**
            translate.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the outputs into trarium-files
        if: ${{ inputs.publish == true && always() }}
        run: |
          set -e
          cd files
          mkdir -p "${{ inputs.outdir }}"
          cp -r "$GITHUB_WORKSPACE/${{ inputs.outdir }}/." "${{ inputs.outdir }}/" 2>/dev/null || true
          cp -f "$GITHUB_WORKSPACE/translate.log" "${{ inputs.outdir }}/translate.log" 2>/dev/null || true
          git config user.name "trarium-ci"
          git config user.email "trarium-ci@users.noreply.github.com"
          git add -A "${{ inputs.outdir }}"
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "ci: translated files from run #${GITHUB_RUN_NUMBER}"
            git push origin HEAD:main
            echo "published to trarium-files"
          fi
