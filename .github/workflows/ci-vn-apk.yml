name: Trarium VN APK (Ren'Py Android → FA)
on:
  push:
    branches: ["feat/visual-novel"]
    paths: ["ci_run/inputs/vn/**", "trarium/vn/**", "ci_run/vn_apk_run.py", ".github/workflows/ci-vn-apk.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt requests arabic-reshaper python-bidi
      - name: Tools (Ren'Py 6.99.4 SDK, unrpyc)
        run: |
          curl -sL https://www.renpy.org/dl/6.99.4/renpy-6.99.4-sdk.tar.bz2 | tar xj
          git clone -q --depth 1 https://github.com/CensoredUsername/unrpyc
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick xdotool >/dev/null
      - name: Translate APK
        run: |
          mkdir -p out
          python ci_run/vn_apk_run.py ci_run/inputs/vn/WillYouRaceMe-1.0-android.apk out renpy-6.99.4-sdk unrpyc 2>&1 | tee out/run.log
      - name: Screenshots (same translated game on the PC engine)
        run: |
          set +e
          G=out/work/project/game
          cat > $G/zz_ci_shot.rpy <<'R'
          label main_menu:
              return
          init -999 python:
              config.performance_test = False
          init 1000 python:
              _preferences.afm_enable = True
              _preferences.afm_time = 3
          R
          mkdir -p out/screenshots
          export SDL_AUDIODRIVER=dummy RENPY_PLATFORM=linux-x86_64 RENPY_PERFORMANCE_TEST=0
          xvfb-run -s "-screen 0 1024x600x24" bash -c '
            renpy-6.99.4-sdk/renpy.sh out/work/project > out/game_run.log 2>&1 &
            sleep 20
            for i in $(seq -w 1 14); do import -window root out/screenshots/shot_$i.png; xdotool mousemove 500 300 click 1; sleep 3; done
            kill %1'
          rm -f $G/zz_ci_shot.rpy*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trarium-vn-apk
          path: |
            out/*.apk
            out/*.json
            out/*.zip
            out/*.log
            out/screenshots/**
