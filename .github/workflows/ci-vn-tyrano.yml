name: Trarium visual novel (TyranoScript → FA)
on:
  push:
    branches: ["feat/visual-novel"]
    paths: ["trarium/vn/**", "ci_run/vn_run.py", "ci_run/tyrano_shots.py", "tests/test_vn.py", ".github/workflows/ci-vn-tyrano.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
jobs:
  tyrano:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt requests pytest playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python -m pytest tests/test_vn.py -q -p no:cacheprovider
      - name: Official TyranoScript sample game
        run: git clone -q --depth 1 https://github.com/ShikemokuMK/tyranoscript.git tyrano_src && rm -rf tyrano_src/.git
      - name: Translate (patch only)
        run: |
          mkdir -p out
          python ci_run/vn_run.py tyrano_src out 2>&1 | tee out/run.log
          cp -r tyrano_src tyrano_fa
          cd tyrano_fa && unzip -oq ../out/*_fa_patch.zip && rm -f README_FA.txt
      - name: Screenshots in a real browser
        run: |
          set +e
          (cd tyrano_fa && python -m http.server 8765 >/dev/null 2>&1 &)
          (cd tyrano_src && python -m http.server 8766 >/dev/null 2>&1 &)
          sleep 2
          python ci_run/tyrano_shots.py http://127.0.0.1:8765/index.html out/screenshots 16
          python ci_run/tyrano_shots.py http://127.0.0.1:8766/index.html out/screenshots_original 6
          ls out/screenshots | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trarium-vn-tyrano
          path: |
            out/*.zip
            out/*.json
            out/*.log
            out/screenshots/**
            out/screenshots_original/**
